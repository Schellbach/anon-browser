name: Preview release

# Unsigned macOS + Linux artifacts for GitHub Releases.
# Gatekeeper will warn on macOS until Apple Developer signing/notarization
# is configured (see docs/04-macos-release.md and docs/05-packaging.md).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Checksums
        run: |
          cd dist
          sha256sum Anon-*-linux.* > SHA256SUMS-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Anon-linux-x64
          path: |
            dist/Anon-*-linux.AppImage
            dist/Anon-*-linux.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  macos:
    name: macOS arm64 unsigned
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test unit and Electron boundaries
        run: npm test

      - name: Build unsigned macOS packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Anon-*-mac.* > SHA256SUMS-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Anon-macos-arm64-unsigned
          path: |
            dist/Anon-*-mac.dmg
            dist/Anon-*-mac.zip
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Anon-linux-x64
          path: release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Anon-macos-arm64-unsigned
          path: release-assets

      - name: Merge checksums
        run: |
          cd release-assets
          cat SHA256SUMS-linux.txt SHA256SUMS-macos.txt > SHA256SUMS
          rm -f SHA256SUMS-linux.txt SHA256SUMS-macos.txt
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "${notes_file}" <<'EOF'
          ## Unsigned preview build

          These binaries are **not** Developer ID-signed or Apple-notarized.
          On macOS, Gatekeeper will warn — right-click → Open the first time, or
          remove quarantine after you verify the checksum:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Anon.app
          ```

          Linux AppImage: `chmod +x Anon-*-linux.AppImage && ./Anon-*-linux.AppImage`

          For a signed/notarized macOS DMG, enroll in the Apple Developer Program
          and follow `docs/04-macos-release.md`, then run the **Signed macOS release**
          workflow.

          See `docs/05-packaging.md` for local build commands.
          EOF

          # Strip the accidental leading spaces from the heredoc above
          sed -i 's/^          //' "${notes_file}"

          shopt -s nullglob
          assets=(release-assets/Anon-* release-assets/SHA256SUMS)
          if [ "${#assets[@]}" -lt 2 ]; then
            echo "::error::Missing release assets"
            ls -la release-assets || true
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
            gh release edit "${tag}" --notes-file "${notes_file}" --prerelease
          else
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --prerelease \
              --title "Anon ${tag} (unsigned preview)" \
              --notes-file "${notes_file}"
          fi
