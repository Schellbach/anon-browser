name: Electron runtime

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: electron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS Electron + pack
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Package application
        run: npm run pack -- --arm64

      - name: Verify packaged Electron version
        run: |
          expected="$(node -p "require('./package.json').devDependencies.electron")"
          actual="$(plutil -extract CFBundleVersion raw \
            "dist/mac-arm64/Anon.app/Contents/Frameworks/Electron Framework.framework/Versions/A/Resources/Info.plist")"
          test "${actual}" = "${expected}"

      - name: Electron smoke
        # Brand/codesign or GUI smoke can hang on shared macOS runners; keep
        # packaging green above. Preview releases do not depend on this step.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          try:
              completed = subprocess.run(
                  ["npm", "run", "test:electron"],
                  timeout=180,
              )
          except subprocess.TimeoutExpired:
              print("Electron smoke exceeded 180s hard timeout", file=sys.stderr)
              sys.exit(1)
          sys.exit(completed.returncode)
          PY

  linux-package:
    name: Linux AppImage package
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Verify artifacts
        run: |
          ls -lah dist/Anon-*-x86_64-linux.AppImage
          ls -lah dist/Anon-*-x64-linux.tar.gz
          chmod +x dist/Anon-*-x86_64-linux.AppImage
          file dist/Anon-*-x86_64-linux.AppImage | grep -q ELF
