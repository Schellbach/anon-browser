name: Signed macOS release

# Produces a Developer ID-signed + notarized Apple Silicon DMG.
# Requires the GitHub `release` environment secrets documented in
# docs/04-macos-release.md. Until those exist, use Preview release
# (.github/workflows/release-preview.yml) for downloadable unsigned builds.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Sign and notarize Apple Silicon build
    runs-on: macos-14
    environment: release
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub release secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8_BASE64}" | base64 -D > "${key_path}"
          chmod 600 "${key_path}"
          echo "APPLE_API_KEY=${key_path}" >> "${GITHUB_ENV}"

      - name: Test
        run: npm test

      - name: Build, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:mac:signed

      - name: Verify signature and notarization ticket
        run: |
          app_path="dist/mac-arm64/Anon.app"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          codesign --display --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"

      - name: Create release checksum
        run: |
          cd dist
          shasum -a 256 ./*-mac.dmg ./*.dmg 2>/dev/null | sort -u > SHA256SUMS-signed.txt || \
            shasum -a 256 ./*.dmg > SHA256SUMS-signed.txt

      - name: Upload signed DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Anon-macOS-Apple-Silicon-signed
          path: |
            dist/*-mac.dmg
            dist/*.dmg
            dist/SHA256SUMS-signed.txt
          if-no-files-found: error

      - name: Attach signed DMG to latest matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          shopt -s nullglob
          dmgs=(dist/*-mac.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            dmgs=(dist/*.dmg)
          fi
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "::error::No DMG found under dist/"
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${dmgs[@]}" dist/SHA256SUMS-signed.txt --clobber
            gh release edit "${tag}" --prerelease=false \
              --title "Anon ${tag}" \
              --notes "$(cat <<EOF
          ## Signed macOS build

          This release includes a Developer ID-signed and notarized Apple Silicon DMG.

          Unsigned Linux / preview assets may also be attached from the Preview release workflow.
          EOF
          )"
          else
            gh release create "${tag}" "${dmgs[@]}" dist/SHA256SUMS-signed.txt \
              --latest \
              --title "Anon ${tag}" \
              --notes "$(cat <<EOF
          ## Signed macOS build

          Developer ID-signed and notarized Apple Silicon DMG.
          EOF
          )"
          fi

      - name: Remove temporary API key
        if: always()
        run: rm -f "${APPLE_API_KEY:-}"
